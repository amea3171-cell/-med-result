<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة نتائج كلية الطب - جامعة القاهرة</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 400px;
            text-align: center;
        }
        h2 {
            color: #1a365d;
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 15px;
            text-align: right;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #4a5568;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e0;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #2b6cb0;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #2c5282;
        }
        #error-msg {
            color: red;
            margin-top: 15px;
            display: none;
        }
        #result-container {
            display: none;
            width: 100%;
            max-width: 800px;
            text-align: center;
        }
        #result-img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }
    </style>
</head>
<body>

    <div class="container" id="login-box">
        <h2>كلية الطب - جامعة القاهرة</h2>
        <p style="color: #718096; font-size: 14px;">استعلام عن النتيجة</p>
        
        <div class="input-group">
            <label for="username">اسم المستخدم</label>
            <input type="text" id="username" placeholder="أدخل اسم المستخدم">
        </div>
        
        <div class="input-group">
            <label for="password">الرمز السرّي</label>
            <input type="password" id="password" placeholder="أدخل الرمز السرّي">
        </div>

        <button onclick="checkCredentials()">عرض النتيجة</button>
        <p id="error-msg">اسم المستخدم أو الرمز غير صحيح!</p>
    </div>

    <div id="result-container">
        <img id="result-img" src="result.jpg" alt="نتيجة الطالب">
    </div>

    <script>
        function checkCredentials() {
            var user = document.getElementById('username').value.trim();
            var pass = document.getElementById('password').value.trim();
            var error = document.getElementById('error-msg');

            // التحقق من البيانات المدخلة
            if (user === "20230505" && pass === "GK20230505") {
                document.getElementById('login-box').style.display = 'none';
                document.getElementById('result-container').style.display = 'block';
            } else {
                error.style.display = 'block';
            }
        }
    </script>

</body>
</html>
